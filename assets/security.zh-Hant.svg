    <circle cx="102" cy="101" r="24" fill="#151515" stroke="#7aa7e8" stroke-opacity="0.65" stroke-width="2"/>
    <path d="M102 125v37" stroke="#7aa7e8" stroke-width="8" stroke-linecap="round"/>
    <path d="m88 95 11 11 22-23" fill="none" stroke="#6ecf9a" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
