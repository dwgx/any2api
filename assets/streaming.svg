<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#151515"/><stop offset="1" stop-color="#1d1b19"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#7b7974"/>
    </marker>
  </defs>
  <rect width="1000" height="300" rx="22" fill="url(#bg)"/>
  <text x="40" y="42" fill="#898781" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="2">STREAM RELAY</text>
  <text x="40" y="76" fill="#f0efec" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="25" font-weight="650">A stream is a contract.</text>
  <text x="40" y="104" fill="#898781" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="12.5">Forward frames as they arrive. Validate the terminal. Never replay after commit.</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">
    <rect x="40" y="140" width="250" height="84" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="56" y="164" fill="#7aa7e8">event: message_start</text>
    <text x="56" y="186" fill="#a5a49a">data: {"type":"message_start"}</text>
    <text x="56" y="208" fill="#6d6b67">role: assistant</text>

    <rect x="375" y="140" width="250" height="84" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="391" y="164" fill="#e08a6d">event: content_block_delta</text>
    <text x="391" y="186" fill="#a5a49a">data: {"text":"Hello"}</text>
    <text x="391" y="208" fill="#6d6b67">incremental</text>

    <rect x="710" y="140" width="250" height="84" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#6ecf9a" stroke-opacity="0.38"/>
    <text x="726" y="164" fill="#6ecf9a">event: message_stop</text>
    <text x="726" y="186" fill="#a5a49a">data: {"type":"message_stop"}</text>
    <text x="726" y="208" fill="#6d6b67">terminal</text>
    <path d="m792 202 5 5 9-10" fill="none" stroke="#6ecf9a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g stroke="#7b7974" stroke-width="1.4" fill="none" marker-end="url(#arrow)">
    <path d="M292 182h78"/><path d="M627 182h78"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#898781">
    <text x="40" y="258">idle guard · first-byte guard · usage observation · client cancellation is not upstream failure</text>
  </g>
</svg>
