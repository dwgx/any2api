<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Not found — Any2API</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('any2api-theme');
        var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = saved || (dark ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="assets/site.css">
</head>
<body>
  <div class="page">
    <main class="section" style="min-height: 70vh; display: grid; place-items: center; text-align: center;">
      <div>
        <div class="eyebrow" style="justify-content:center;">404</div>
        <h1 style="margin: 16px 0 12px; font-size: clamp(40px, 8vw, 72px); letter-spacing: -.045em;">Wrong turn.</h1>
        <p style="max-width: 460px; margin: 0 auto 24px;">This path is not part of the gateway. Head back to the landing page or the source.</p>
        <div class="actions" style="justify-content:center;">
          <a class="btn btn-primary" href="/any2api/">Back home</a>
          <a class="btn" href="https://github.com/dwgx/any2api" target="_blank" rel="noreferrer">GitHub</a>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
